openapi: 3.1.0
info:
  title: Buyza Store API
  version: 1.0.0
  description: |
    Core storefront and order-management API. Amounts are integer minor units.
    Order placement currently supports Cash on Delivery. The API is mounted at
    /api. Some response fields are omitted from this concise reference; consult
    the server controllers and validators for full validation rules.
servers:
  - url: https://{host}/api
    description: Replace host with the deployed API host.
    variables:
      host:
        default: api.example.com
  - url: http://localhost:5000/api
    description: Local API
tags:
  - name: Authentication
  - name: Catalog
  - name: Checkout
  - name: Orders
  - name: Admin
paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, confirmPassword]
              properties:
                name: { type: string, minLength: 2, maxLength: 60 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72 }
                confirmPassword: { type: string }
      responses:
        "201": { description: Account created }
        "409": { description: Email already registered }
        "400": { description: Invalid input }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                rememberMe: { type: boolean }
      responses:
        "200":
          description: Signed in; refresh session is set as an HttpOnly cookie.
        "401": { description: Invalid credentials or blocked account }
        "429": { description: Login rate limit reached }
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh the access session
      description: Requires the refresh cookie and the configured browser mutation marker.
      responses:
        "200": { description: Session refreshed }
        "401": { description: Refresh session is invalid or expired }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: End the current refresh session
      responses:
        "200": { description: Session ended and cookie cleared }
  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password-reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Generic response that does not reveal account existence }
        "429": { description: Reset request rate limit reached }
  /auth/reset-password/{token}:
    post:
      tags: [Authentication]
      summary: Reset password with a one-time token
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirmPassword]
              properties:
                password: { type: string, minLength: 8, maxLength: 72 }
                confirmPassword: { type: string }
      responses:
        "200": { description: Password updated }
        "400": { description: Token is invalid, expired, or already used }
  /categories:
    get:
      tags: [Catalog]
      summary: List category tree
      responses:
        "200": { description: Category tree }
  /products:
    get:
      tags: [Catalog]
      summary: List and filter active products
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 80 }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: brand
          schema: { type: string }
        - in: query
          name: minPrice
          schema: { type: integer, minimum: 0 }
        - in: query
          name: maxPrice
          schema: { type: integer, minimum: 0 }
        - in: query
          name: sort
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200": { description: Paginated product results }
        "400": { description: Invalid filter }
  /products/{slug}:
    get:
      tags: [Catalog]
      summary: Get product details by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200": { description: Product detail }
        "404": { description: Product not found }
  /checkout/quote:
    post:
      tags: [Checkout]
      summary: Quote checkout without placing an order
      description: Guest requests submit items, email, and address. Authenticated requests may use the saved cart and an owned addressId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                addressId: { type: string }
                address:
                  type: object
                  required: [fullName, phone, line1, city, province, postalCode, country]
                  properties:
                    fullName: { type: string }
                    phone: { type: string }
                    line1: { type: string }
                    line2: { type: string }
                    city: { type: string }
                    province: { type: string }
                    postalCode: { type: string }
                    country: { type: string, const: Sri Lanka }
                email: { type: string, format: email }
                items:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId: { type: string }
                      variantSku: { type: [string, "null"] }
                      quantity: { type: integer, minimum: 1, maximum: 10 }
                buyNow: { type: boolean }
                shippingMethodId: { type: string }
      responses:
        "200": { description: Live quote, shipping options, totals, and stock issues }
        "400": { description: Invalid checkout details }
  /orders:
    post:
      tags: [Orders]
      summary: Place an order (Cash on Delivery)
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string }
          description: Optional; use the same key to safely retry a request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingMethodId, paymentMethod]
              properties:
                addressId: { type: string }
                address: { type: object }
                email: { type: string, format: email }
                items: { type: array, items: { type: object } }
                buyNow: { type: boolean }
                shippingMethodId: { type: string }
                paymentMethod: { type: string, const: cod }
      responses:
        "201": { description: Order placed and stock reserved transactionally }
        "409":
          { description: Idempotency conflict, stock conflict, or invalid transition }
        "400": { description: Invalid checkout details }
    get:
      tags: [Orders]
      summary: List the authenticated customer's orders
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Customer order history }
        "401": { description: Authentication required }
  /orders/{orderNumber}:
    get:
      tags: [Orders]
      summary: Get an order owned by the authenticated customer
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderNumber
          required: true
          schema: { type: string }
      responses:
        "200": { description: Order details }
        "404": { description: Order not found }
  /orders/{orderNumber}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an eligible order
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderNumber
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum:
                    [
                      changed_mind,
                      ordered_by_mistake,
                      found_cheaper,
                      delivery_too_slow,
                      other,
                    ]
                note: { type: string, maxLength: 300 }
      responses:
        "200": { description: Order cancelled and eligible stock restored }
        "409": { description: Order is no longer cancellable }
  /admin/orders:
    get:
      tags: [Admin]
      summary: List orders for permitted staff
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Filtered order list }
        "403": { description: Permission required }
  /admin/orders/{orderNumber}/status:
    patch:
      tags: [Admin]
      summary: Advance or cancel an order
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderNumber
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [processing, shipped, delivered, cancelled]
                note: { type: string }
      responses:
        "200": { description: Updated order }
        "403": { description: Permission required }
        "409": { description: Invalid status transition }
  /admin/orders/{orderNumber}/mark-paid:
    post:
      tags: [Admin]
      summary: Record received COD payment for an eligible order
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderNumber
          required: true
          schema: { type: string }
      responses:
        "200": { description: Payment recorded }
        "409": { description: Order is not eligible to be marked paid }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
